<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threads Daily Selfie Prompt Generator v2</title>
<style>
  :root {
    --bg: #f7f6f4;
    --card: #ffffff;
    --text: #2c2a29;
    --sub: #78736e;
    --accent: #b87d6b;
    --accent-dark: #9c6453;
    --border: #e5e0db;
    --tag-bg: #f0ebe6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  header p {
    font-size: 0.78rem;
    color: var(--sub);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .preset-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-sub {
    background: var(--tag-bg);
    color: var(--text);
  }
  .btn-sub:active { background: #e2dad2; }
  .btn-full {
    width: 100%;
    padding: 12px;
    font-size: 0.9rem;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .field-row {
    margin-bottom: 8px;
  }
  label {
    display: block;
    font-size: 0.72rem;
    color: var(--sub);
    margin-bottom: 3px;
    font-weight: 600;
  }
  select, input[type="text"], textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.82rem;
    background: #fff;
    color: var(--text);
  }
  textarea {
    resize: vertical;
    font-family: inherit;
  }
  .badge {
    font-size: 0.7rem;
    background: var(--tag-bg);
    color: var(--sub);
    padding: 2px 8px;
    border-radius: 99px;
  }
  details summary {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--sub);
    cursor: pointer;
  }
  .output-box {
    background: #faf9f7;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.78rem;
    white-space: pre-wrap;
    max-height: 280px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .caption-box {
    background: #fdf8f6;
    border-left: 3px solid var(--accent);
    padding: 8px 10px;
    font-size: 0.8rem;
    margin-bottom: 10px;
  }
  .history-list {
    font-size: 0.75rem;
    color: var(--sub);
    list-style: none;
  }
  .history-list li {
    padding: 5px 0;
    border-bottom: 1px dashed var(--border);
    display: flex;
    justify-content: space-between;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #2c2a29;
    color: #fff;
    padding: 8px 18px;
    border-radius: 99px;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>日常スナップ 2枚構成ジェネレーター</h1>
  <p>顔完全固定・清楚／きれいめ／ほんのり色気対応（9:8左右分割）</p>
</header>

<!-- おまかせガチャ -->
<div class="card">

  </div>

    <button class="btn-sub" onclick="generateStory('holiday_home')">🛏️ 休日：おうち色気</button>

    </div>
    <div>
      <label>場所（自宅・外出）</label>
      <select id="place1" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>ヘアアレンジ</label>
      <select id="hair1" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>撮影スタイル</label>
      <select id="style1" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>画角・距離</label>
      <select id="angle1" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>背景の映り込み</label>
      <select id="bg1" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="field-row">
    <label>服装プリセット（選ぶと下の欄に反映）</label>

  </div>
  <div class="field-row">
    <label>服装・小物（自由編集可）</label>
    <input type="text" id="cloth1" oninput="updatePreview()">
  </div>
  <div>
    <label>表情・仕草</label>
    <input type="text" id="pose1" oninput="updatePreview()">
  </div>
</div>

<!-- 2枚目設定 -->
<div class="card">
  <div class="section-title">
    <span>2枚目（右側 9:16）</span>
    <button class="btn-sub" style="padding:4px 8px;font-size:0.72rem;" onclick="randomizeSlot(2)">🎲 この枠だけ変更</button>
  </div>
  <div class="grid-2">
    <div>
      <label>時間帯</label>
      <select id="time2" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>場所（自宅・外出）</label>
      <select id="place2" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>ヘアアレンジ</label>
      <select id="hair2" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>撮影スタイル</label>
      <select id="style2" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>画角・距離</label>
      <select id="angle2" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>背景の映り込み</label>
      <select id="bg2" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="field-row">
    <label>服装プリセット（選ぶと下の欄に反映）</label>
    <select id="clothPreset2" onchange="applyClothPreset(2)"></select>
  </div>
  <div class="field-row">
    <label>服装・小物（自由編集可）</label>
    <input type="text" id="cloth2" oninput="updatePreview()">
  </div>
  <div>
    <label>表情・仕草</label>
    <input type="text" id="pose2" oninput="updatePreview()">
  </div>
</div>

<!-- 固定プロンプト編集 -->
<div class="card">
  <details>
    <summary>⚙️ 顔完全固定プロンプトを確認・編集（自動保存）</summary>
    <div style="margin-top:8px;">
      <textarea id="basePrompt" rows="10" oninput="saveBasePrompt(); updatePreview();"></textarea>
      <button class="btn-sub" style="margin-top:6px;font-size:0.74rem;" onclick="resetBasePrompt()">初期プロンプトに戻す</button>
    </div>
  </details>
</div>

<!-- 出力結果 -->
<div class="card">
  <div class="section-title"><span>生成プロンプト＆投稿文</span></div>
  <div class="caption-box" id="captionOutput"></div>
  <div class="output-box" id="promptOutput"></div>
  <button class="btn-primary btn-full" onclick="copyAll()">📋 プロンプトをコピー（履歴に保存）</button>
</div>

<!-- 履歴 -->
<div class="card">
  <div class="section-title">
    <span>直近の使用履歴（ネタ被り防止）</span>
    <button class="btn-sub" style="padding:3px 8px;font-size:0.7rem;" onclick="clearHistory()">クリア</button>
  </div>
  <ul class="history-list" id="historyList"></ul>
</div>

<div class="toast" id="toast">コピーしました！</div>

  const savedBase = localStorage.getItem(STORAGE_KEY_BASE);
  document.getElementById("basePrompt").value = savedBase || DEFAULT_BASE_PROMPT;

  [1, 2].forEach(num => {
    fillSelect(`time${num}`, DATA.times);
    fillSelect(`place${num}`, DATA.places.map(p => p.label));
    fillSelect(`hair${num}`, DATA.hairs);
    fillSelect(`style${num}`, DATA.styles);
    fillSelect(`angle${num}`, DATA.angles);
    fillSelect(`bg${num}`, DATA.bgs);
    fillClothPresets(`clothPreset${num}`);
  });

  renderHistory();
  generateStory("work_gap");
}

function fillSelect(id, items) {
  const el = document.getElementById(id);
  el.innerHTML = items.map(v => `<option value="${v}">${v}</option>`).join("");
}

function fillClothPresets(id) {
  const el = document.getElementById(id);
  el.innerHTML = `
    <option value="">-- テイスト別の服装を選ぶ --</option>
    <optgroup label="【清楚・通勤】医療事務オンモード">
      ${DATA.outfits.seiso.map(v => `<option value="${v}">${v}</option>`).join("")}
    </optgroup>
    <optgroup label="【きれいめ・休日】お出かけ・美容">
      ${DATA.outfits.kireime.map(v => `<option value="${v}">${v}</option>`).join("")}
    </optgroup>
    <optgroup label="【ほんのり色気】帰宅後・おうち時間">
      ${DATA.outfits.irokebit.map(v => `<option value="${v}">${v}</option>`).join("")}
    </optgroup>
  `;
}

function applyClothPreset(num) {
  const preset = document.getElementById(`clothPreset${num}`).value;
  if (preset) {
    document.getElementById(`cloth${num}`).value = preset;
    updatePreview();
  }
}

function saveBasePrompt() {
  localStorage.setItem(STORAGE_KEY_BASE, document.getElementById("basePrompt").value);
}

function resetBasePrompt() {
  document.getElementById("basePrompt").value = DEFAULT_BASE_PROMPT;
  saveBasePrompt();
  updatePreview();
  showToast("初期プロンプトに戻しました");
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function setSlot(num, cfg) {
  document.getElementById(`time${num}`).value = cfg.time;
  document.getElementById(`place${num}`).value = cfg.place;
  document.getElementById(`hair${num}`).value = cfg.hair;
  document.getElementById(`style${num}`).value = cfg.style;
  document.getElementById(`angle${num}`).value = cfg.angle;
  document.getElementById(`bg${num}`).value = cfg.bg;
  document.getElementById(`cloth${num}`).value = cfg.cloth;
  document.getElementById(`clothPreset${num}`).value = "";
  document.getElementById(`pose${num}`).value = cfg.pose;
}

function generateStory(mode) {
  if (mode === "work_gap") {
    setSlot(1, {
      time: "朝",
      place: DATA.places[0].label, // 玄関
      hair: pick([DATA.hairs[0], DATA.hairs[2], DATA.hairs[3]]),
      style: "自撮り（スマホ画角外）",
      angle: "顔アップ",
      bg: "極力背景は映さない",
      cloth: pick(DATA.outfits.seiso),
      pose: pick(["少し緊張した微笑み", "口角をふんわり上げた上品な笑顔", "髪を耳にかけながらカメラをちらっと見る仕草"])
    });
    const nightRoom = pick([DATA.places[1].label, DATA.places[2].label, DATA.places[3].label]);
    setSlot(2, {
      time: "夜",
      place: nightRoom,
      hair: pick([DATA.hairs[1], DATA.hairs[0], DATA.hairs[5]]),
      style: nightRoom.includes("脱衣所") ? "鏡越し自撮り（スマホ持ち）" : "自撮り（スマホ画角外）",
      angle: nightRoom.includes("脱衣所") ? "ウエストアップ" : pick(["顔ドアップ", "バストアップ"]),
      bg: "部屋の雰囲気が少しわかる程度",
      cloth: pick(DATA.outfits.irokebit),
      pose: pick(["ほっと一息ついたオフモードの優しい表情", "少し照れたような柔らかい上目遣いの微笑み", "少し緊張した微笑み"])
    });
  } else if (mode === "work_break") {
    const dayHair = pick([DATA.hairs[0], DATA.hairs[2], DATA.hairs[3]]);
    const dayCloth = pick(DATA.outfits.seiso);
    setSlot(1, {
      time: "昼",
      place: DATA.places[5].label, // カフェ
      hair: dayHair,
      style: "自撮り（スマホ画角外）",
      angle: "バストアップ",
      bg: "生活感や背景を自然に映す",
      cloth: dayCloth,
      pose: "飲み物のカップを口元に近づけながらの自然体な表情"
    });
    setSlot(2, {
      time: "夕方",
      place: DATA.places[6].label, // 通勤路
      hair: dayHair,
      style: "自撮り（スマホ画角外）",
      angle: "顔アップ",
      bg: "生活感や背景を自然に映す",
      cloth: dayCloth,
      pose: "ほっと一息ついたオフモードの優しい表情"
    });
  } else if (mode === "holiday_out") {
    const startPlace = pick([DATA.places[4].label, DATA.places[0].label]); // 姿見 or 玄関
    const holiHair = pick([DATA.hairs[0], DATA.hairs[4], DATA.hairs[2]]);
    const holiCloth = pick(DATA.outfits.kireime);
    setSlot(1, {
      time: "朝",
      place: startPlace,
      hair: holiHair,
      style: startPlace.includes("姿見") ? "鏡越し自撮り（スマホ持ち）" : "自撮り（スマホ画角外）",
      angle: startPlace.includes("姿見") ? "全身（鏡越し）" : "バストアップ",
      bg: "部屋の雰囲気が少しわかる程度",
      cloth: holiCloth,
      pose: "口角をふんわり上げた上品な笑顔"
    });
    const outPlace = pick([DATA.places[5].label, DATA.places[7].label, DATA.places[8].label, DATA.places[9].label, DATA.places[10].label]);
    setSlot(2, {
      time: outPlace.includes("ディナー") ? "夜" : "昼",
      place: outPlace,
      hair: holiHair,
      style: pick(["友人撮影風（他撮り）", "自撮り（スマホ画角外）"]),
      angle: "バストアップ",
      bg: "生活感や背景を自然に映す",
      cloth: holiCloth,
      pose: pick(DATA.poses)
    });
  } else if (mode === "holiday_home") {
    setSlot(1, {
      time: "朝",
      place: DATA.places[2].label, // 寝室
      hair: DATA.hairs[0],
      style: "自撮り（スマホ画角外）",
      angle: "バストアップ",
      bg: "部屋の雰囲気が少しわかる程度",
      cloth: pick(DATA.outfits.irokebit),
      pose: "眠そうに目を細めたリラックス微笑み"
    });
    const room2 = pick([DATA.places[1].label, DATA.places[3].label]);
    setSlot(2, {
      time: "夜",
      place: room2,
      hair: pick([DATA.hairs[1], DATA.hairs[5]]),
      style: room2.includes("脱衣所") ? "鏡越し自撮り（スマホ持ち）" : "自撮り（スマホ画角外）",
      angle: room2.includes("脱衣所") ? "ウエストアップ" : "バストアップ",
      bg: "部屋の雰囲気が少しわかる程度",
      cloth: pick(DATA.outfits.irokebit),
      pose: "少し照れたような柔らかい上目遣いの微笑み"
    });
  }

  document.getElementById("captionOutput").textContent = "💬 投稿文案: " + pick(DATA.captions[mode]);
  updatePreview();
}

function randomizeSlot(num) {
  const placeObj = pick(DATA.places);
  const isMirror = placeObj.short === "脱衣所" || placeObj.short === "姿見越し";
  const clothPool = placeObj.type === "home"
    ? (placeObj.short === "姿見越し" ? DATA.outfits.kireime : DATA.outfits.irokebit)
    : pick([DATA.outfits.seiso, DATA.outfits.kireime]);

  setSlot(num, {
    time: pick(DATA.times),
    place: placeObj.label,
    hair: pick(DATA.hairs),
    style: isMirror ? "鏡越し自撮り（スマホ持ち）" : pick(["自撮り（スマホ画角外）", "友人撮影風（他撮り）"]),
    angle: placeObj.short === "姿見越し" ? "全身（鏡越し）" : pick(["顔ドアップ", "顔アップ", "バストアップ"]),
    bg: pick(DATA.bgs),
    cloth: pick(clothPool),
    pose: pick(DATA.poses)
  });
  updatePreview();
}

function formatSlot(num) {
  const time = document.getElementById(`time${num}`).value;
  const place = document.getElementById(`place${num}`).value;
  const hair = document.getElementById(`hair${num}`).value;
  const style = document.getElementById(`style${num}`).value;
  const angle = document.getElementById(`angle${num}`).value;
  const bg = document.getElementById(`bg${num}`).value;
  const cloth = document.getElementById(`cloth${num}`).value;
  const pose = document.getElementById(`pose${num}`).value;

  return `${num}枚目
${time}
${place}
${angle}
${style}
${bg}
髪型：${hair}
服装：${cloth}
表情・仕草：${pose}`;
}

function updatePreview() {
  const base = document.getElementById("basePrompt").value.trim();
  const fullText = `${base}\n\n${formatSlot(1)}\n\n${formatSlot(2)}`;
  document.getElementById("promptOutput").textContent = fullText;
}

function copyAll() {
  const text = document.getElementById("promptOutput").textContent;
  navigator.clipboard.writeText(text).then(() => {
    showToast("プロンプトをコピーしました！");
    saveHistory();
  });
}

function saveHistory() {
  const p1 = document.getElementById("place1").value.split("（")[0];
  const p2 = document.getElementById("place2").value.split("（")[0];
  const now = new Date();
  const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HIST) || "[]");
  history.unshift({ date: dateStr, summary: `${p1} × ${p2}` });
  localStorage.setItem(STORAGE_KEY_HIST, JSON.stringify(history.slice(0, 10)));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HIST) || "[]");
  document.getElementById("recentBadge").textContent = `履歴: ${history.length}件`;
  const list = document.getElementById("historyList");
  if (history.length === 0) {
    list.innerHTML = "<li>まだ履歴がありません</li>";
    return;
  }
  list.innerHTML = history.map(h => `<li><span>${h.summary}</span><span>${h.date}</span></li>`).join("");
}

function clearHistory() {
  localStorage.removeItem(STORAGE_KEY_HIST);
  renderHistory();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

init();
</script>
</body>
</html>

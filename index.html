<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threads Daily Selfie Generator v3</title>
<style>
  :root {
    --bg: #f7f6f4;
    --card: #ffffff;
    --text: #2c2a29;
    --sub: #78736e;
    --accent: #b87d6b;
    --accent-dark: #9c6453;
    --border: #e5e0db;
    --tag-bg: #f0ebe6;
    --ss: #5c9ead;
    --aw: #b87d6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
    padding-bottom: 48px;
  }
  header {
    text-align: center;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  header p {
    font-size: 0.76rem;
    color: var(--sub);
  }
  .season-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .season-btn {
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--sub);
    font-size: 0.84rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }
  .season-btn.active-ss {
    border-color: var(--ss);
    background: #eef7f9;
    color: #2f6c7a;
  }
  .season-btn.active-aw {
    border-color: var(--aw);
    background: #faf2ef;
    color: #8a5140;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .preset-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .preset-btns .span-2 {
    grid-column: span 2;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-sub {
    background: var(--tag-bg);
    color: var(--text);
  }
  .btn-sub:active { background: #e2dad2; }
  .btn-dark {
    background: #3d3835;
    color: #fff;
  }
  .btn-full {
    width: 100%;
    padding: 12px;
    font-size: 0.88rem;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .field-row {
    margin-bottom: 8px;
  }
  label {
    display: block;
    font-size: 0.72rem;
    color: var(--sub);
    margin-bottom: 3px;
    font-weight: 600;
  }
  select, input[type="text"], textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.82rem;
    background: #fff;
    color: var(--text);
  }
  textarea {
    resize: vertical;
    font-family: inherit;
  }
  .badge {
    font-size: 0.7rem;
    background: var(--tag-bg);
    color: var(--sub);
    padding: 2px 8px;
    border-radius: 99px;
  }
  .tone-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .tone-btn {
    padding: 6px 4px;
    font-size: 0.72rem;
    background: var(--tag-bg);
    color: var(--sub);
    border: 1px solid transparent;
  }
  .tone-btn.active {
    background: #fdf2ee;
    color: var(--accent-dark);
    border-color: var(--accent);
  }
  .caption-box {
    background: #fdf8f6;
    border-left: 3px solid var(--accent);
    padding: 10px;
    font-size: 0.83rem;
    margin-bottom: 8px;
    white-space: pre-wrap;
  }
  .caption-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  details summary {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--sub);
    cursor: pointer;
  }
  .output-box {
    background: #faf9f7;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.77rem;
    white-space: pre-wrap;
    max-height: 260px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .history-list {
    font-size: 0.75rem;
    color: var(--sub);
    list-style: none;
  }
  .history-list li {
    padding: 5px 0;
    border-bottom: 1px dashed var(--border);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #2c2a29;
    color: #fff;
    padding: 9px 18px;
    border-radius: 99px;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>日常スナップ 2枚構成ジェネレーター v3</h1>
  <p>顔完全固定・季節切替・SNSあるある＆Threads投稿文対応</p>
</header>

<!-- 季節切り替え -->
<div class="season-bar">
  <button id="btnSS" class="season-btn" onclick="setSeason('ss')">🌸☀️ 春夏モード</button>
  <button id="btnAW" class="season-btn active-aw" onclick="setSeason('aw')">🍁❄️ 秋冬モード</button>
</div>

<!-- おまかせガチャ -->
<div class="card">
  <div class="section-title">
    <span>1日のストーリー自動生成（直近被り回避）</span>
    <span class="badge" id="recentBadge">履歴: 0件</span>
  </div>
  <div class="preset-btns">
    <button class="btn-primary" onclick="generateStory('work_gap')">🏢 平日：清楚出勤×夜色気</button>
    <button class="btn-primary" onclick="generateStory('work_break')">☕ 平日：昼カフェ×退勤</button>

    <button class="btn-sub" onclick="generateStory('holiday_home')">🛏️ 休日：おうち色気</button>
    <button class="btn-dark span-2" onclick="generateStory('sns_aruaru')">✨ SNS自撮り「あるある」特化ガチャ</button>
  </div>
</div>

<!-- 1枚目設定 -->
<div class="card">
  <div class="section-title">
    <span>1枚目（左側 9:16）</span>
    <button class="btn-sub" style="padding:4px 8px;font-size:0.72rem;" onclick="randomizeSlot(1)">🎲 この枠だけ変更</button>
  </div>
  <div class="grid-2">
    <div>
      <label>時間帯</label>
      <select id="time1" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>場所（自宅・外出・あるある）</label>
      <select id="place1" onchange="onPlaceChange(1)"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>ヘアアレンジ</label>
      <select id="hair1" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>撮影スタイル</label>
      <select id="style1" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>画角・距離</label>
      <select id="angle1" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>背景の映り込み</label>
      <select id="bg1" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="field-row">
    <label>服装プリセット（季節連動）</label>
    <select id="clothPreset1" onchange="applyClothPreset(1)"></select>
  </div>
  <div class="field-row">
    <label>服装・小物（自由編集可）</label>
    <input type="text" id="cloth1" oninput="updatePreview()">
  </div>
  <div>
    <label>表情・仕草（あるある動作など）</label>
    <input type="text" id="pose1" oninput="updatePreview()">
  </div>
</div>

<!-- 2枚目設定 -->
<div class="card">
  <div class="section-title">
    <span>2枚目（右側 9:16）</span>
    <button class="btn-sub" style="padding:4px 8px;font-size:0.72rem;" onclick="randomizeSlot(2)">🎲 この枠だけ変更</button>
  </div>
  <div class="grid-2">
    <div>
      <label>時間帯</label>
      <select id="time2" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>場所（自宅・外出・あるある）</label>
      <select id="place2" onchange="onPlaceChange(2)"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>ヘアアレンジ</label>
      <select id="hair2" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>撮影スタイル</label>
      <select id="style2" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>画角・距離</label>
      <select id="angle2" onchange="updatePreview()"></select>
    </div>
    <div>
      <label>背景の映り込み</label>
      <select id="bg2" onchange="updatePreview()"></select>
    </div>
  </div>
  <div class="field-row">
    <label>服装プリセット（季節連動）</label>
    <select id="clothPreset2" onchange="applyClothPreset(2)"></select>
  </div>
  <div class="field-row">
    <label>服装・小物（自由編集可）</label>
    <input type="text" id="cloth2" oninput="updatePreview()">
  </div>
  <div>
    <label>表情・仕草（あるある動作など）</label>
    <input type="text" id="pose2" oninput="updatePreview()">
  </div>
</div>

<!-- Threads投稿文エリア -->
<div class="card">
  <div class="section-title"><span>Threads投稿文ジェネレーター</span></div>
  <div class="tone-tabs">
    <button id="tone_balance" class="tone-btn active" onclick="setTone('balance')">⚖️ 男女バランス</button>
    <button id="tone_male" class="tone-btn" onclick="setTone('male')">💘 男ウケ・距離近</button>
    <button id="tone_reply" class="tone-btn" onclick="setTone('reply')">💬 共感・リプ誘発</button>
  </div>
  <div class="caption-box" id="captionOutput"></div>
  <div class="caption-actions">
    <button class="btn-sub" onclick="refreshCaption()">🔄 投稿文だけ変更</button>
    <button class="btn-primary" onclick="copyCaption()">📋 投稿文をコピー</button>
  </div>
</div>

<!-- 固定プロンプト編集 -->
<div class="card">
  <details>
    <summary>⚙️ 顔完全固定プロンプトを確認・編集（自動保存）</summary>
    <div style="margin-top:8px;">
      <textarea id="basePrompt" rows="10" oninput="saveBasePrompt(); updatePreview();"></textarea>
      <button class="btn-sub" style="margin-top:6px;font-size:0.74rem;" onclick="resetBasePrompt()">初期プロンプトに戻す</button>
    </div>
  </details>
</div>

<!-- 画像生成プロンプト出力 -->
<div class="card">
  <div class="section-title"><span>画像生成用プロンプト（自動整合チェック済）</span></div>
  <div class="output-box" id="promptOutput"></div>
  <button class="btn-primary btn-full" onclick="copyPrompt()">📋 画像プロンプトをコピー（履歴に保存）</button>
</div>

<!-- 履歴 -->
<div class="card">
  <div class="section-title">
    <span>直近の使用履歴（直近5件は自動回避）</span>
    <button class="btn-sub" style="padding:3px 8px;font-size:0.7rem;" onclick="clearHistory()">クリア</button>
  </div>
  <ul class="history-list" id="historyList"></ul>
</div>

<div class="toast" id="toast">コピーしました！</div>

<script>
const STORAGE_KEY_BASE = "threads_base_prompt_v3";

const DEFAULT_BASE_PROMPT = `生っぽく
手ブレ
加工なし

【被写体・顔の完全固定】
被写体は26歳の成人日本人女性。参照画像の女性と完全に同一の顔立ち・輪郭・目鼻立ち・雰囲気を厳密に固定し、左右2枚の写真で顔が一切ブレないように描写する。
すっきりとした小顔の卵型で、色白で自然なツヤのある透明感の高い素肌。
くっきりとした二重の大きな瞳と自然な涙袋、主張しすぎない整った鼻筋、口角が自然に上がる上品な薄いピンクの唇。

髪色は落ち着いたダークブラウン〜ナチュラルブラウン、透け感のあるシースルーバングと顔に沿うサイドバングが基本。
肩幅や腕が華奢なスレンダー体型で、鎖骨やデコルテラインがきれいに見えつつ、胸元には自然な丸みとメリハリのある女性らしいスタイル。

1枚の横長画像（9:8）の中に、9:16構図の写真を左右2枚並べる。左右はそれぞれ独立したスマホ写真として成立する構図。被写体はややアップ気味で、各半分を切り抜くとそのまま9:16になるように配置。

【写真表現】
超高精細でリアルなスマートフォン写真。
iPhoneで実際に撮影されたような自然な写真表現。

SNSに投稿された日常のスナップ写真のようなリアリティ。
広告写真、ファッション誌、スタジオ撮影のような完成されすぎた写真にはしない。

自然な露出。

現実的なダイナミックレンジ。

自然なピントの外れ方。
背景にはスマートフォン撮影らしい自然なボケを使用する。

顔だけを過剰にシャープにせず、髪、肌、衣服、背景まで一貫した写真として描写する。

ポーズは作り込みすぎない。
カメラを強く意識したモデルポーズではなく、
会話中、歩いている途中、笑っている瞬間、飲み物を飲む、髪を直す、スマートフォンを見るなど、
日常の一瞬を偶然撮影したような自然な仕草を優先する。

笑顔の場合も、完璧な営業スマイルではなく、友達といるときの自然な笑顔。
歯並びや表情にも自然な個体差を残す。

写真全体に「実際にこの女性がその日に撮った、または友人に撮ってもらった一枚」という生活感を持たせる。

【撮影者・構図】
一人でいるシーン（通常自撮り）：
本人がスマートフォンで撮影したような自撮り写真。腕やスマートフォンは画面内に入れず、画角外から構えて撮影した自然な構図。

鏡越しシーンの指定がある場合のみ：
洗面台や姿見の鏡越しに、本人が自然な手つきでスマートフォンを持って撮影しているリアルな構図。

友人と一緒にいるシーン：
友人がスマートフォンで撮影したような他人撮影の写真。被写体本人だけがカメラを強く意識しているようにはせず、会話や笑顔の自然な瞬間を切り取る。必要に応じて写真の端に友人の肩やテーブル、飲み物を少し入れる。

【SNSスナップとしての雰囲気】
InstagramやThreadsに実際に投稿されていそうな日常写真。
少しだけ構図が崩れていたり、髪が風で動いていたり、背景に一般の人が自然にぼけて映るようなリアルなスマホ写真らしさを残す。
背景に個人情報、看板、住所、電話番号などを入れない。
過剰なAI美化、過剰な肌補正、過剰な被写界深度、CG感、3DCG感、イラスト感を避ける。`;

function init() {
  const savedSeason = localStorage.getItem(STORAGE_KEY_SEASON);
  currentSeason = (savedSeason === "ss" || savedSeason === "aw") ? savedSeason : "aw";

  const savedBase = localStorage.getItem(STORAGE_KEY_BASE);
  document.getElementById("basePrompt").value = savedBase || DEFAULT_BASE_PROMPT;

  [1, 2].forEach(num => {
    fillSelect(`time${num}`, DATA.times);
    fillSelect(`place${num}`, DATA.places.map(p => p.label));
    fillSelect(`hair${num}`, DATA.hairs);
    fillSelect(`style${num}`, DATA.styles);
    fillSelect(`angle${num}`, DATA.angles);
    fillSelect(`bg${num}`, DATA.bgs);
  });

  updateSeasonUI();
  renderHistory();
  generateStory("work_gap");
}

function setSeason(season) {
  currentSeason = season;
  localStorage.setItem(STORAGE_KEY_SEASON, season);
  updateSeasonUI();
  generateStory(currentMode);
  showToast(season === "ss" ? "春夏モードに切り替えました" : "秋冬モードに切り替えました");
}

function updateSeasonUI() {
  const btnSS = document.getElementById("btnSS");
  const btnAW = document.getElementById("btnAW");
  btnSS.className = "season-btn" + (currentSeason === "ss" ? " active-ss" : "");
  btnAW.className = "season-btn" + (currentSeason === "aw" ? " active-aw" : "");
  [1, 2].forEach(num => fillClothPresets(`clothPreset${num}`));
}

function fillSelect(id, items) {
  const el = document.getElementById(id);
  el.textContent = "";
  items.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    el.appendChild(opt);
  });
}

function fillClothPresets(id) {
  const el = document.getElementById(id);
  const seasonData = DATA.outfits[currentSeason];
  const seasonLabel = currentSeason === "ss" ? "春夏" : "秋冬";
  el.textContent = "";

  const defOpt = document.createElement("option");
  defOpt.value = "";
  defOpt.textContent = `-- ${seasonLabel}テイスト別コーデを選ぶ --`;
  el.appendChild(defOpt);

  const groups = [
    { label: `【清楚・通勤（${seasonLabel}）】医療事務オンモード`, items: seasonData.seiso },
    { label: `【きれいめ・休日（${seasonLabel}）】お出かけ・美容`, items: seasonData.kireime },
    { label: `【ほんのり色気（${seasonLabel}）】帰宅後・おうち時間`, items: seasonData.irokebit }
  ];

  groups.forEach(g => {
    const og = document.createElement("optgroup");
    og.label = g.label;
    g.items.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      og.appendChild(opt);
    });
    el.appendChild(og);
  });
}

function onPlaceChange(num) {
  const placeLabel = document.getElementById(`place${num}`).value;
  const placeObj = DATA.places.find(p => p.label === placeLabel);
  if (placeObj) {
    if (placeObj.mirror) {
      document.getElementById(`style${num}`).value = "鏡越し自撮り（スマホ持ち）";
      if (placeObj.short === "姿見越し") {
        document.getElementById(`angle${num}`).value = "全身（鏡越し）";
      }
    } else if (document.getElementById(`style${num}`).value === "鏡越し自撮り（スマホ持ち）") {
      document.getElementById(`style${num}`).value = "自撮り（スマホ画角外）";
    }
  }
  updatePreview();
}

function applyClothPreset(num) {
  const preset = document.getElementById(`clothPreset${num}`).value;
  if (preset) {
    document.getElementById(`cloth${num}`).value = preset;
    updatePreview();
  }
}

function getRecentHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY_HIST) || "[]");
  } catch {
    return [];
  }
}

function pickAvoidingRecent(arr, recentTexts) {
  const filtered = arr.filter(item => {
    const key = typeof item === "string" ? item : item.short;
    return !recentTexts.some(r => r.includes(key));
  });
  const pool = filtered.length > 0 ? filtered : arr;
  return pool[Math.floor(Math.random() * pool.length)];
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function setSlot(num, cfg) {
  document.getElementById(`time${num}`).value = cfg.time;
  document.getElementById(`place${num}`).value = cfg.place;
  document.getElementById(`hair${num}`).value = cfg.hair;
  document.getElementById(`style${num}`).value = cfg.style;
  document.getElementById(`angle${num}`).value = cfg.angle;
  document.getElementById(`bg${num}`).value = cfg.bg;
  document.getElementById(`cloth${num}`).value = cfg.cloth;
  document.getElementById(`clothPreset${num}`).value = "";
  document.getElementById(`pose${num}`).value = cfg.pose;
}

function randomizeSlot(num) {
  const sOut = DATA.outfits[currentSeason];
  const recent = getRecentHistory().slice(0, 5).map(h => h.summary);
  const placeObj = pickAvoidingRecent(DATA.places, recent);
  const clothPool = placeObj.type === "home"
    ? (placeObj.short === "姿見越し" ? sOut.kireime : sOut.irokebit)
    : pick([sOut.seiso, sOut.kireime]);

  setSlot(num, {
    time: pick(DATA.times),
    place: placeObj.label,
    hair: pick(DATA.hairs),
    style: placeObj.mirror ? "鏡越し自撮り（スマホ持ち）" : pick(["自撮り（スマホ画角外）", "友人撮影風（他撮り）"]),
    angle: placeObj.short === "姿見越し" ? "全身（鏡越し）" : pick(["顔ドアップ", "顔アップ", "バストアップ"]),
    bg: pick(DATA.bgs),
    cloth: pick(clothPool),
    pose: pick([...DATA.poses.normal, ...DATA.poses.aruaru])
  });
  updatePreview();
}

  const pool = DATA.captions[currentSeason][currentTone];
  const current = document.getElementById("captionOutput").textContent;
  const candidates = pool.filter(c => c !== current);
  const next = candidates.length > 0 ? pick(candidates) : pick(pool);
  document.getElementById("captionOutput").textContent = next;
}

function formatSlot(num) {
  const time = document.getElementById(`time${num}`).value;
  const place = document.getElementById(`place${num}`).value;
  const hair = document.getElementById(`hair${num}`).value;
  const style = document.getElementById(`style${num}`).value;
  const angle = document.getElementById(`angle${num}`).value;
  const bg = document.getElementById(`bg${num}`).value;
  const cloth = document.getElementById(`cloth${num}`).value;
  const pose = document.getElementById(`pose${num}`).value;

  return `${num}枚目
${time}
${place}
${angle}
${style}
${bg}
髪型：${hair}
服装：${cloth}
表情・仕草：${pose}`;
}

function updatePreview() {
  const s1 = document.getElementById("style1").value;
  const s2 = document.getElementById("style2").value;
  const hasMirror = s1.includes("鏡越し") || s2.includes("鏡越し");
  const phoneRule = hasMirror
    ? "通常自撮りカットはスマホは画角外（鏡越し指定のカットのみスマホを自然に手に持つ）"
    : "スマホは画角外";

  const baseRaw = document.getElementById("basePrompt").value.trim();
  const baseResolved = baseRaw.replace("{{PHONE_RULE}}", phoneRule);
  const seasonNote = currentSeason === "ss" ? "季節感：春夏（軽やかな光と服装）" : "季節感：秋冬（柔らかな光と秋冬素材）";

  const fullText = `${baseResolved}\n\n${seasonNote}\n\n${formatSlot(1)}\n\n${formatSlot(2)}`;
  document.getElementById("promptOutput").textContent = fullText;
}

function safeCopy(text, successMsg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(successMsg);
    }).catch(() => fallbackCopy(text, successMsg));
  } else {
    fallbackCopy(text, successMsg);
  }
}

function fallbackCopy(text, successMsg) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    showToast(successMsg);
  } catch {
    showToast("コピーに失敗しました。手動で選択してください");
  }
  document.body.removeChild(ta);
}

function copyPrompt() {
  const text = document.getElementById("promptOutput").textContent;
  safeCopy(text, "画像プロンプトをコピーしました！");
  saveHistory();
}

function copyCaption() {
  const text = document.getElementById("captionOutput").textContent;
  safeCopy(text, "Threads投稿文をコピーしました！");
}

function saveBasePrompt() {
  localStorage.setItem(STORAGE_KEY_BASE, document.getElementById("basePrompt").value);
}

function resetBasePrompt() {
  document.getElementById("basePrompt").value = DEFAULT_BASE_PROMPT;
  saveBasePrompt();
  updatePreview();
  showToast("初期プロンプトに戻しました");
}

function saveHistory() {
  const p1 = document.getElementById("place1").value.split("（")[0];
  const p2 = document.getElementById("place2").value.split("（")[0];
  const c1 = document.getElementById("cloth1").value.slice(0, 12);
  const now = new Date();
  const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  const history = getRecentHistory();
  history.unshift({
    date: dateStr,
    summary: `[${currentSeason.toUpperCase()}] ${p1} × ${p2}`,
    cloth: c1
  });
  localStorage.setItem(STORAGE_KEY_HIST, JSON.stringify(history.slice(0, 15)));
  renderHistory();
}

function renderHistory() {
  const history = getRecentHistory();
  document.getElementById("recentBadge").textContent = `履歴: ${history.length}件`;
  const list = document.getElementById("historyList");
  list.textContent = "";

  if (history.length === 0) {
    const li = document.createElement("li");
    li.textContent = "まだ履歴がありません";
    list.appendChild(li);
    return;
  }

  history.forEach(h => {
    const li = document.createElement("li");
    const spanSum = document.createElement("span");
    spanSum.textContent = h.summary;
    const spanDate = document.createElement("span");
    spanDate.textContent = h.date;
    li.appendChild(spanSum);
    li.appendChild(spanDate);
    list.appendChild(li);
  });
}

function clearHistory() {
  localStorage.removeItem(STORAGE_KEY_HIST);
  renderHistory();
  showToast("履歴をクリアしました");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

init();
</script>
